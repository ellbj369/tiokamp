# ── Server ──────────────────────────────────────────────
server.port=8080

# ── Datasource: H2 (dev) ────────────────────────────────
spring.datasource.url=jdbc:h2:file:./tiokampdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA ─────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# All views read pre-built DTOs, never lazy entities — so close the DB session
# with the transaction instead of holding it open through view rendering.
spring.jpa.open-in-view=false

# ── Network: gzip responses + let browsers cache static assets ──
# Smaller, cached responses matter most for guests on mobile over the NAS's
# home connection.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
# CSS/JS/SVG rarely change during the party — cache them in the browser for a day.
spring.web.resources.cache.cachecontrol.max-age=86400
spring.web.resources.cache.cachecontrol.cache-public=true

# ── Thymeleaf ───────────────────────────────────────────
spring.thymeleaf.cache=false

# ── File uploads (profile pictures) ────────────────────
# The registration page downscales photos in the browser before upload;
# the generous limit here is a safety net for browsers where that fails.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# Upload storage path (relative to working directory)
app.upload-dir=uploads

# ── Remember-me cookie duration (30 days) ───────────────
app.remember-me-validity-seconds=2592000

# ── Sessions last the whole party ───────────────────────
server.servlet.session.timeout=12h

# ── Admins (comma-separated usernames, case-insensitive) ─
# Admins see /admin with all scores and the "calculate final results" button.
app.admin-usernames=ellan

# ── Makaronigissning facit ──────────────────────────────
# The actual number of macaroni in the jar. MUST be set before the final
# calculation (or via the APP_MAKARONI_FACIT env var in docker-compose.yml).
# app.makaroni-facit=537
