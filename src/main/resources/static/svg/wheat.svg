<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 125">
  <!-- Three wheat stalks, matching the invitation motif -->
  <g stroke="#4a7c2f" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M20,120 Q16,84 20,52"/>
    <path d="M45,120 L45,48"/>
    <path d="M70,120 Q74,84 70,52"/>
  </g>
  <g fill="#4a7c2f">
    <!-- left head -->
    <g transform="translate(20,0)">
      <ellipse rx="3" ry="6.5" transform="translate(-4,46) rotate(28)"/>
      <ellipse rx="3" ry="6.5" transform="translate(4,46) rotate(-28)"/>
      <ellipse rx="3" ry="6.5" transform="translate(-4,37) rotate(28)"/>
      <ellipse rx="3" ry="6.5" transform="translate(4,37) rotate(-28)"/>
      <ellipse rx="3" ry="6.5" transform="translate(-4,28) rotate(28)"/>
      <ellipse rx="3" ry="6.5" transform="translate(4,28) rotate(-28)"/>
      <ellipse rx="2.8" ry="6" transform="translate(0,19)"/>
    </g>
    <!-- middle head -->
    <g transform="translate(45,-6)">
      <ellipse rx="3" ry="6.5" transform="translate(-4,46) rotate(28)"/>
      <ellipse rx="3" ry="6.5" transform="translate(4,46) rotate(-28)"/>
      <ellipse rx="3" ry="6.5" transform="translate(-4,37) rotate(28)"/>
      <ellipse rx="3" ry="6.5" transform="translate(4,37) rotate(-28)"/>
      <ellipse rx="3" ry="6.5" transform="translate(-4,28) rotate(28)"/>
      <ellipse rx="3" ry="6.5" transform="translate(4,28) rotate(-28)"/>
      <ellipse rx="2.8" ry="6" transform="translate(0,19)"/>
    </g>
    <!-- right head -->
    <g transform="translate(70,0)">
      <ellipse rx="3" ry="6.5" transform="translate(-4,46) rotate(28)"/>
      <ellipse rx="3" ry="6.5" transform="translate(4,46) rotate(-28)"/>
      <ellipse rx="3" ry="6.5" transform="translate(-4,37) rotate(28)"/>
      <ellipse rx="3" ry="6.5" transform="translate(4,37) rotate(-28)"/>
      <ellipse rx="3" ry="6.5" transform="translate(-4,28) rotate(28)"/>
      <ellipse rx="3" ry="6.5" transform="translate(4,28) rotate(-28)"/>
      <ellipse rx="2.8" ry="6" transform="translate(0,19)"/>
    </g>
  </g>
  <!-- awns -->
  <g stroke="#4a7c2f" stroke-width="0.8" fill="none" stroke-linecap="round">
    <path d="M20,44 L13,10"/><path d="M20,44 L27,10"/>
    <path d="M45,38 L38,4"/><path d="M45,38 L52,4"/>
    <path d="M70,44 L63,10"/><path d="M70,44 L77,10"/>
  </g>
</svg>
