<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 85 120">
  <!-- Two cornflowers (blåklint), matching the invitation motif -->
  <g stroke="#4a7c2f" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M52,34 Q50,80 46,116"/>
    <path d="M24,58 Q28,90 40,116"/>
    <path d="M48,86 Q37,81 32,70"/>
  </g>
  <!-- big flower -->
  <g transform="translate(52,28)" fill="#4a7c2f">
    <g>
      <path d="M0,0 L-2.5,-15 L2.5,-11 Z"/>
      <path d="M0,0 L-2.5,-15 L2.5,-11 Z" transform="rotate(40)"/>
      <path d="M0,0 L-2.5,-13 L2.5,-10 Z" transform="rotate(80)"/>
      <path d="M0,0 L-2.5,-15 L2.5,-11 Z" transform="rotate(120)"/>
      <path d="M0,0 L-2.5,-13 L2.5,-10 Z" transform="rotate(160)"/>
      <path d="M0,0 L-2.5,-15 L2.5,-11 Z" transform="rotate(200)"/>
      <path d="M0,0 L-2.5,-13 L2.5,-10 Z" transform="rotate(240)"/>
      <path d="M0,0 L-2.5,-15 L2.5,-11 Z" transform="rotate(280)"/>
      <path d="M0,0 L-2.5,-13 L2.5,-10 Z" transform="rotate(320)"/>
    </g>
    <circle r="3" fill="#f0f8e8" stroke="#4a7c2f" stroke-width="1.2"/>
  </g>
  <!-- small flower -->
  <g transform="translate(24,52) scale(0.72)" fill="#4a7c2f">
    <g>
      <path d="M0,0 L-2.5,-15 L2.5,-11 Z"/>
      <path d="M0,0 L-2.5,-13 L2.5,-10 Z" transform="rotate(45)"/>
      <path d="M0,0 L-2.5,-15 L2.5,-11 Z" transform="rotate(90)"/>
      <path d="M0,0 L-2.5,-13 L2.5,-10 Z" transform="rotate(135)"/>
      <path d="M0,0 L-2.5,-15 L2.5,-11 Z" transform="rotate(180)"/>
      <path d="M0,0 L-2.5,-13 L2.5,-10 Z" transform="rotate(225)"/>
      <path d="M0,0 L-2.5,-15 L2.5,-11 Z" transform="rotate(270)"/>
      <path d="M0,0 L-2.5,-13 L2.5,-10 Z" transform="rotate(315)"/>
    </g>
    <circle r="3" fill="#f0f8e8" stroke="#4a7c2f" stroke-width="1.2"/>
  </g>
</svg>
