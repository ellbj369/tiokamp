<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 170">
  <!-- Two clinking champagne flutes, hand-drawn line style -->
  <g stroke="#4a7c2f" fill="none" stroke-width="1.6" stroke-linecap="round">
    <!-- pop sparks -->
    <g stroke-width="1.4">
      <path d="M85,26 L85,14"/>
      <path d="M72,32 L64,24"/>
      <path d="M98,32 L106,24"/>
    </g>
    <circle cx="77" cy="12" r="1.8" fill="#4a7c2f" stroke="none"/>
    <circle cx="94" cy="10" r="1.8" fill="#4a7c2f" stroke="none"/>
    <circle cx="85" cy="3" r="1.5" fill="#4a7c2f" stroke="none"/>
    <!-- left flute -->
    <g transform="translate(60,158) rotate(14)">
      <path d="M-9,-108 L-6,-58 Q0,-50 6,-58 L9,-108"/>
      <path d="M-9,-108 Q0,-104 9,-108"/>
      <path d="M-7,-84 Q0,-80 7,-84"/>
      <circle cx="-2" cy="-95" r="1.6" fill="#4a7c2f" stroke="none"/>
      <circle cx="3" cy="-88" r="1.3" fill="#4a7c2f" stroke="none"/>
      <circle cx="-3" cy="-74" r="1.2" fill="#4a7c2f" stroke="none"/>
      <path d="M0,-50 L0,-12"/>
      <path d="M-13,-6 Q0,3 13,-6 Q0,-11 -13,-6 Z"/>
    </g>
    <!-- right flute -->
    <g transform="translate(112,158) rotate(-14)">
      <path d="M-9,-108 L-6,-58 Q0,-50 6,-58 L9,-108"/>
      <path d="M-9,-108 Q0,-104 9,-108"/>
      <path d="M-7,-84 Q0,-80 7,-84"/>
      <circle cx="2" cy="-96" r="1.6" fill="#4a7c2f" stroke="none"/>
      <circle cx="-3" cy="-87" r="1.3" fill="#4a7c2f" stroke="none"/>
      <circle cx="3" cy="-75" r="1.2" fill="#4a7c2f" stroke="none"/>
      <path d="M0,-50 L0,-12"/>
      <path d="M-13,-6 Q0,3 13,-6 Q0,-11 -13,-6 Z"/>
    </g>
  </g>
</svg>
